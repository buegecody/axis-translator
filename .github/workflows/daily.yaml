name: Daily Translation

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:
  schedule:
    # process: 08:00 CST (00:00 UTC) — 爬蟲 + 翻譯
    # send:   17:00 CST (09:00 UTC) — 寄送 Email
    - cron: '0 0 * * *'
    - cron: '0 9 * * *'

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch, translate and save to DB
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        timeout-minutes: 15
        run: |
          cd scripts && python main.py process
          python generate_posts.py

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: articles-db
          path: articles.db
          retention-days: 1

      - name: Commit code + posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ _posts/
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git status
          git commit -m "daily: $(date +%Y-%m-%d)"
          git push

  send:
    runs-on: ubuntu-latest
    needs: process
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: articles-db
          path: .
          if-no-artifact-found: continue

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          cd scripts && python main.py send

      - name: Commit DB sent flag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.db
          git diff --staged --quiet || git commit -m "daily: $(date +%Y-%m-%d) sent"
          git push

  build-pages:
    runs-on: ubuntu-latest
    needs: process
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll
        run: |
          bundle install
          bundle exec jekyll build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/