---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <div class="meta">
    <span>📅 {{ page.date | date: "%Y/%m/%d" }}</span>
    <span>🏷️ {{ page.category }}</span>
  </div>
  <a class="original-link" href="{{ page.original_url }}" target="_blank">📄 閱讀原文（Axis）</a>
  <div class="content">{{ content }}</div>
</article>
